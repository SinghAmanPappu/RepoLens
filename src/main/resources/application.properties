# RepoLens configuration — all secrets come from environment variables.
# Spring resolves ${VAR:default} from the OS env. For local dev you can set
# them in a .env file (Spring Boot 3.x supports optional .env import).
spring.application.name=RepoLens
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Gemini (Google AI). Set GEMINI_API_KEY in environment or .env.
# Used ONLY for chat by default (low volume). Embeddings default to local Ollama (free, unlimited).
gemini.api-key=${GEMINI_API_KEY:dummy-key-for-local-boot}
gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-2.5-flash-lite}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

# Embeddings — permanently free via local Ollama (no 30k TPM quota).
# Set EMBEDDING_PROVIDER=gemini to fall back to cloud (quota-limited). Default: ollama.
embedding.provider=${EMBEDDING_PROVIDER:ollama}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:nomic-embed-text}
ollama.dimension=${OLLAMA_DIMENSION:768}

# GitHub PAT. Set GITHUB_TOKEN in environment or .env.
# Optional: unauthenticated API works for public repos but rate-limits fast.
github.token=${GITHUB_TOKEN:dummy-token-for-local-boot}

# PostgreSQL / pgvector (Docker). See docker-compose.yml.
# Host 5433 (not 5432) to avoid clash with local Windows Postgres.
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5433}
db.database=${DB_NAME:repolens}
db.user=${DB_USER:repolens}
db.password=${DB_PASSWORD:repolens}
db.table=${DB_TABLE:test_segments}
db.dimension=${DB_DIMENSION:768}

# Ingestion — UNIVERSAL: any GitHub repo (not just Java). Broad text allowlist.
# Crawler skips binaries, lock/minified files, and vendored dirs automatically.
ingestion.extensions=.java,.kt,.kts,.scala,.groovy,.gradle,.py,.pyi,.js,.mjs,.cjs,.jsx,.ts,.tsx,.vue,.go,.rs,.c,.h,.cpp,.cc,.cxx,.hpp,.cs,.rb,.php,.swift,.m,.mm,.lua,.sh,.bash,.ps1,.bat,.html,.htm,.css,.scss,.sass,.less,.xml,.json,.yaml,.yml,.toml,.ini,.env.example,.properties,.md,.txt,.rst,.adoc,.sql,.graphql,.proto,.thrift,.pl,.r,.jl,.hs,.ml,.ex,.exs,.erl,.clj,.cljs,.zig,.dart,.vue,.astro,.svelte,.tf,.tfvars,.mod,.sum,.work,.dockerfile,.containerfile
ingestion.max-file-bytes=${INGESTION_MAX_FILE_BYTES:300000}
ingestion.max-files-per-repo=${INGESTION_MAX_FILES_PER_REPO:300}

# Retrieval — tuned for local nomic-embed-text (cosine lower than Gemini; 0.6 was too strict).
retrieval.min-score=${RETRIEVAL_MIN_SCORE:0.30}
retrieval.max-results=${RETRIEVAL_MAX_RESULTS:5}

# Thymeleaf (dev: no cache so template edits reflect immediately)
spring.thymeleaf.cache=false

logging.level.root=INFO
logging.level.dev.langchain4j=INFO
