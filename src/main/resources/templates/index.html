<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset=UTF-8>
    <title>RepoLens | Ingest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body text-center">
                <h1 class="display-4">🔍 RepoLens</h1>
                <p class="text-muted">Enter a GitHub Repository URL to start the analysis.</p>
                
                <form th:action="@{/api/Repository}" method="post" class="mt-4">
                    <div class="input-group mb-3">
                        <input type="text" name="url" class="form-control" placeholder="e.g. SinghAmanPappu/Java-Console-Tasks" required>
                        <button class="btn btn-primary" type="submit">Analyze Repository</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
