<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>RepoLens | Error</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-body text-center">
      <h1 class="display-6">Something went wrong</h1>
      <p class="text-muted" th:text="${error} ?: 'Unexpected error. Please try again.'">Error</p>
      <a class="btn btn-primary" th:href="@{/api/}">← Back to Home</a>
    </div>
  </div>
</div>
</body>
</html>
